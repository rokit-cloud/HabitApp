replicaCount: 1

image:
  repository: rokit45/habitapp
  tag: "9"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  SPRING_APPLICATION_NAME: "habit-tracker"
  SERVER_PORT: "8080"
  SPRING_MVC_PROBLEMDETAILS_ENABLED: "true"

secret:
  enabled: false
  data: {}

ingress:
  enabled: false
  className: traefik
  host: habitapp.example.com
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /
  startup:
    periodSeconds: 10
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    periodSeconds: 20
    failureThreshold: 3
