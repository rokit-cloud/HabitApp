apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: habitapp-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rokit-cloud/HabitApp.git
    targetRevision: main
    path: helm/habitapp
  destination:
    server: https://kubernetes.default.svc
    namespace: habitapp-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
